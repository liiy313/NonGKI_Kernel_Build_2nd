name: Build Redmi K40 Gaming (ares) (MIUI12.5 A11)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "Redmi_K40_Gaming"
  DEVICE_CODENAME : "ares"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  # 官方内核源码，与 MIUI 12.5 (Android 11) 匹配
  KERNEL_SOURCE : "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
  KERNEL_BRANCH : "ares-r-oss"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "ares_user_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU：先尝试指定 commit，失败则自动使用 v3.1.0 标签
  KERNELSU_SOURCE : "https://github.com/tiann/KernelSU"
  KERNELSU_BRANCH : "main"
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : ""
  KERNELSU_METHOD: "manual"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false
  SUSFS_UPDATE : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : "https://github.com/liiy313/NonGKI_Kernel_Build_2nd/releases/download/boot-img/boot.img"
  DTBO_SOURCE : "https://github.com/liiy313/NonGKI_Kernel_Build_2nd/releases/download/boot-img/dtbo.img"

  NEED_DTBO : true
  NEED_DTB : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "MIUI12.5_Android11"

  PYTHON_VERSION: "3"
  PACK_METHOD: "MKBOOTIMG"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "true"
  GENERATE_CHIP: "mediatek"
  BUILD_TARGET: "Image.gz-dtb"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # 修复官方旧内核与 Proton Clang 的兼容性
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' arch/arm64/configs/ares_user_defconfig
          # 进入 KernelSU 目录，智能获取历史并切换到目标版本
          cd KernelSU
          # 仅当仓库为浅克隆时才执行 --unshallow
          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow --tags
          else
            git fetch --tags
          fi
          # 尝试检出指定 commit，若失败则回退到 v3.1.0 标签
          if git cat-file -t f34dbc95 2>/dev/null; then
            git checkout f34dbc95
            echo "Checked out commit f34dbc95"
          else
            echo "Commit f34dbc95 not found, falling back to v3.1.0"
            git checkout v3.1.0
          fi

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📤 Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: device_kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
